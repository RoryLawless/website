<!-- Accessibility patch for Quarto-generated behaviour -->

<!-- Add tabindex="-1" to the skip link target so Safari moves keyboard focus
     there when the skip link is activated. tabindex="-1" makes the element
     programmatically focusable without inserting it into the natural Tab order.
     Targets <main id="quarto-document-content">, which is present on every page. -->
<script>
  function patchSkipLinkTarget() {
    var main = document.getElementById('quarto-document-content');
    if (main && !main.hasAttribute('tabindex')) {
      main.setAttribute('tabindex', '-1');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', patchSkipLinkTarget);
  } else {
    patchSkipLinkTarget();
  }
</script>
