project:
  type: website
  output-dir: _site
  render: 
    - "*.qmd"
  resources:
    - .well-known/
    - _headers
    - _redirects
    - /assets/fonts/
website:
  favicon: assets/favicon-512.png
  open-graph:
    image: /assets/social-card.png
    image-alt: "Rory Lawless, rorylawless.com"
  twitter-card:
    card-style: summary_large_image
    image: /assets/social-card.png
    image-alt: "Rory Lawless, rorylawless.com"
  description: "Rory Lawless is a data analyst in Washington, DC, with a background in education policy, financial regulation, and mental health research."
  site-url: https://rorylawless.com
  title: "Rory Lawless"
  repo-url: https://github.com/rorylawless/website
  llms-txt: true
  page-footer:
    center: |
      Made with [Quarto](https://quarto.org/) in DC.<br>[Website](https://rorylawless.com/) © 2026 by Rory Lawless is licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/).
  draft-mode: gone
  navbar:
    collapse: false
    pinned: true
    search: false
format:
  html:
    theme:
      - none
      - brand
      - assets/custom.scss
    highlight-style: a11y
    code-copy: true
    code-overflow: wrap
    email-obfuscation: references
    include-in-header: html/favicon.html
    include-after-body:
      - html/skip-link.html
      - html/a11y.html
    html-math-method: plain
