meta:
  name: Rory Lawless
  link: https://rorylawless.com

color:
  palette:
    teal: "#24617a"
    off-white: "#fbf5f5"
    ink: "#070a0c"
    link-teal: "#183e4d"
  foreground: ink
  background: off-white
  primary: teal
  link: link-teal
  light: off-white
  dark: ink

typography:
  fonts:
    - family: Newsreader
      source: system
  base:
    family: Newsreader
    size: 20px
    weight: 400
    line-height: 1.55
  # Quarto otherwise gives h1 to h3 a weight of 600. Headings inherit the base
  # family and its fallbacks.
  headings:
    weight: 500
  monospace:
    size: 0.8em
  link:
    color: link-teal
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: $brand-off-white
      navbar-fg: $brand-ink
      footer-fg: $brand-ink
