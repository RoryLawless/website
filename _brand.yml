meta:
  name: Rory Lawless
  link: https://rorylawless.com

color:
  palette:
    teal: "#24617a"
    off-white: "#fbf5f5"
    ink: "#070a0c"
    link-teal: "#183e4d"
  foreground: ink
  background: off-white
  primary: teal
  link: link-teal
  light: off-white
  dark: ink

typography:
  fonts:
    - family: Newsreader
      source: system
  base:
    family: Newsreader
    size: 20px
    weight: 400
    line-height: 1.55
  headings:
    family: Newsreader
    weight: 500
    line-height: 1.2
  monospace:
    size: 0.8em
  link:
    color: link-teal
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: "#fbf5f5"
      navbar-fg: "#070a0c"
      footer-bg: "#fbf5f5"
      footer-fg: "#070a0c"
