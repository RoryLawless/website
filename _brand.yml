meta:
  name: Rory Lawless
  link: https://rorylawless.com

color:
  palette:
    teal: "#24617a"
    off-white: "#fbf5f5"
    ink: "#070a0c"
    link-teal: "#183e4d"
    # Dark mode. Bootstrap applies these through the *-dark defaults below when
    # assets/color-scheme.js sets data-bs-theme="dark" on <html>.
    dark-background: "#12171a"
    dark-surface: "#191f23"
    dark-border: "#30373b"
    dark-text: "#eae2e3"
    dark-link: "#a4cbdd"
    dark-teal: "#5ca3c2"
  foreground: ink
  background: off-white
  primary: teal
  link: link-teal
  light: off-white
  dark: ink

typography:
  fonts:
    - family: Newsreader
      source: system
  base:
    family: Newsreader
    size: 20px
    weight: 400
    line-height: 1.55
  # Quarto otherwise gives h1 to h3 a weight of 600. Headings inherit the base
  # family and its fallbacks.
  headings:
    weight: 500
  monospace:
    size: 0.8em
  link:
    color: link-teal
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: $brand-off-white
      navbar-fg: $brand-ink
      footer-fg: $brand-ink
      body-bg-dark: $brand-dark-background
      body-color-dark: $brand-dark-text
      link-color-dark: $brand-dark-link
      border-color-dark: $brand-dark-border
      code-color-dark: $brand-dark-text
